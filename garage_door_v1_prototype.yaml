substitutions:
  device_name: garage-door
  friendly_name: Garage Door

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

bluetooth_proxy:
  active: true

logger:

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── SSR trigger ──────────────────────────────────────────────────────────────
# GPIO17 → 220Ω → G3VM-61A1 SSR → Marantec XB03 terminals 1+2 (GND+Pulse)

switch:
  - platform: gpio
    pin: GPIO17
    id: garage_trigger
    restore_mode: ALWAYS_OFF
    internal: true

# ── Pulse script ─────────────────────────────────────────────────────────────
# 300ms momentary closure — equivalent to pressing the wall button.

script:
  - id: trigger_pulse
    then:
      - switch.turn_on: garage_trigger
      - delay: 300ms
      - switch.turn_off: garage_trigger

# ── Garage door cover ────────────────────────────────────────────────────────
# V1: optimistic mode — assumed_state exposes both open and close at all times.
# Reed switch state sensing is V2 scope.

cover:
  - platform: template
    name: "Garage Door"
    device_class: garage
    optimistic: true
    assumed_state: true
    open_action:
      - script.execute: trigger_pulse
    close_action:
      - script.execute: trigger_pulse
    stop_action:
      - script.execute: trigger_pulse
