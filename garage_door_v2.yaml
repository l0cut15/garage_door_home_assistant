substitutions:
  device_name: garage-door-v2
  friendly_name: Garage Door-v2

  # ── Calibration ──────────────────────────────────────────────────────────────
  # Sensor is mounted horizontally on the ceiling, beam pointing across the door
  # opening. Horizontal mount chosen over vertical: same information (closed ~0.67m,
  # open = NaN), cleaner cabling.
  #
  # closed_distance_m: reading when door is fully closed. Measured 0.67m; +5cm margin.
  #
  # open_distance_m: not used for OPEN detection in this mount position — the door
  #   never reaches this threshold before going out of range. Set above realistic
  #   range to prevent false triggers. OPEN is detected by sustained NaN instead.
  #
  # nan_open_count: consecutive NaN readings required to declare OPEN.
  #   At 500ms update interval: 6 = 3s. Boot NaN clears in <1s so no false trigger.
  closed_distance_m: "0.72"  # measured 0.67m + 5cm margin (2026-05-19)
  open_distance_m: "1.10"    # not used — above realistic range
  nan_open_count: "6"        # 6 × 500ms = 3s sustained NaN → OPEN

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: "n"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

bluetooth_proxy:
  active: true

logger:

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── NaN streak tracking ───────────────────────────────────────────────────────
# had_valid_reading: suppresses NaN-as-open on boot before sensor warms up.
# nan_streak: counts consecutive NaN readings; cover lambda declares OPEN at threshold.
globals:
  - id: had_valid_reading
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: nan_streak
    type: int
    restore_value: false
    initial_value: '0'

# ── I2C bus ──────────────────────────────────────────────────────────────────
i2c:
  sda: GPIO1
  scl: GPIO3
  frequency: 10kHz
  scan: true

# ── VL53L0X distance sensor ───────────────────────────────────────────────────
# Horizontal ceiling mount. Closed reads ~0.67m; open reads NaN (out of range).
sensor:
  - platform: vl53l0x
    name: "Garage Door Distance"
    id: door_distance
    address: 0x29
    update_interval: 500ms
    long_range: true
    on_value:
      - lambda: |-
          if (isnan(x) || x <= 0.0f) {
            id(nan_streak)++;
          } else {
            id(had_valid_reading) = true;
            id(nan_streak) = 0;
          }

# ── SSR trigger ──────────────────────────────────────────────────────────────
# GPIO7 → 220Ω → G3VM-61A1 SSR → Marantec XB03 terminals 1+2 (GND+Pulse)
switch:
  - platform: gpio
    pin: GPIO7
    id: garage_trigger
    restore_mode: ALWAYS_OFF
    internal: true

# ── Pulse script ─────────────────────────────────────────────────────────────
script:
  - id: trigger_pulse
    then:
      - switch.turn_on: garage_trigger
      - delay: 300ms
      - switch.turn_off: garage_trigger

# ── Garage door cover ────────────────────────────────────────────────────────
# State logic:
#   distance <= closed_distance_m          → CLOSED
#   NaN sustained >= nan_open_count × 500ms → OPEN  (Option B)
#   anything else                          → indeterminate
#
# STOP BUTTON — BEHAVIOUR UNCONFIRMED:
# The Marantec Comfort 280 impulse cycle is: Open → Stop → Close → Stop → Open.
# After a stop mid-travel, the next impulse REVERSES direction (does not resume).
# ESPHome is unaware of this — if it issues an open pulse after a mid-travel stop,
# the Marantec may close instead. Test physically before relying on stop from HA.
cover:
  - platform: template
    name: "Garage Door"
    device_class: garage
    lambda: |-
      if (!id(door_distance).has_state()) {
        return {};
      }
      float d = id(door_distance).state;
      if (!isnan(d) && d > 0) {
        if (d <= ${closed_distance_m}) {
          return COVER_CLOSED;
        }
        return {};
      }
      if (id(had_valid_reading) && id(nan_streak) >= ${nan_open_count}) {
        return COVER_OPEN;
      }
      return {};
    open_action:
      - script.execute: trigger_pulse
    close_action:
      - script.execute: trigger_pulse
    stop_action:
      - script.execute: trigger_pulse
