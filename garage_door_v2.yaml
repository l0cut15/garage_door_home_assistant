substitutions:
  device_name: garage-door-v2
  friendly_name: Garage Door-v2

  # ── Calibration ──────────────────────────────────────────────────────────────
  # Measure these values after mounting the VL53L0X on the ceiling above the door.
  #
  # closed_distance_m: distance (m) from sensor to top of door when fully closed.
  #   Measure with a tape or read the raw sensor value from HA while door is closed.
  #   Add ~5cm margin so normal vibration doesn't flicker the state.
  #
  # open_distance_m: threshold (m) beyond which the door is declared open.
  #   Does NOT need to equal the true sensor-to-floor distance when door is rolled up.
  #   Set it to something clearly larger than closed_distance_m — e.g. 0.5–0.8m.
  #   The VL53L0X will read well beyond this when the door is out of the way.
  #
  # TODO: replace placeholder values after installation measurement.
  closed_distance_m: "0.20" # placeholder — door top ~20cm below ceiling sensor
  open_distance_m: "0.60" # placeholder — anything beyond 60cm = door is open

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: "n"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

bluetooth_proxy:
  active: true

logger:

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── I2C bus ──────────────────────────────────────────────────────────────────
# GPIO1/GPIO3 on ESP32-C3 Super Mini.
i2c:
  sda: GPIO1
  scl: GPIO3
  frequency: 10kHz
  scan: true

# ── VL53L0X distance sensor ───────────────────────────────────────────────────
# Ceiling-mounted, pointing down at the top of the door.
# long_range: true extends range to ~1.2m+ at the cost of slightly slower updates.
# Publishes raw distance to HA — use this during calibration to read actual values.
sensor:
  - platform: vl53l0x
    name: "Garage Door Distance"
    id: door_distance
    address: 0x29
    update_interval: 500ms
    long_range: true

# ── SSR trigger ──────────────────────────────────────────────────────────────
# GPIO7 → 220Ω → G3VM-61A1 SSR → Marantec XB03 terminals 1+2 (GND+Pulse)
switch:
  - platform: gpio
    pin: GPIO7
    id: garage_trigger
    restore_mode: ALWAYS_OFF
    internal: true

# ── Pulse script ─────────────────────────────────────────────────────────────
script:
  - id: trigger_pulse
    then:
      - switch.turn_on: garage_trigger
      - delay: 300ms
      - switch.turn_off: garage_trigger

# ── Garage door cover ────────────────────────────────────────────────────────
# State is driven by VL53L0X distance thresholds:
#   distance <= closed_distance_m  → CLOSED
#   distance >= open_distance_m    → OPEN
#   anything between               → indeterminate (ESPHome shows Opening/Closing
#                                    while an action is in progress, else last state)
#
#
# STOP BUTTON — BEHAVIOUR UNCONFIRMED:
# The Marantec Comfort 280 impulse cycle is: Open → Stop → Close → Stop → Open.
# After a stop mid-travel, the next impulse REVERSES direction (does not resume).
# ESPHome is unaware of this — if it issues an open pulse after a mid-travel stop,
# the Marantec may close instead. Test physically before relying on stop from HA.
cover:
  - platform: template
    name: "Garage Door"
    device_class: garage
    lambda: |-
      if (!id(door_distance).has_state()) {
        return {};
      }
      float d = id(door_distance).state;
      if (isnan(d) || d <= 0) {
        return {};
      }
      if (d <= ${closed_distance_m}) {
        return COVER_CLOSED;
      }
      if (d >= ${open_distance_m}) {
        return COVER_OPEN;
      }
      return {};
    open_action:
      - script.execute: trigger_pulse
    close_action:
      - script.execute: trigger_pulse
    stop_action:
      - script.execute: trigger_pulse
