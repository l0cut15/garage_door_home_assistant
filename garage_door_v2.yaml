substitutions:
  device_name: garage-door-v2
  friendly_name: Garage Door-v2

  # ── Calibration ──────────────────────────────────────────────────────────────
  # Sensor is on the ceiling, pointing at the top of the door panel.
  # Door OPEN:   panel is up near the sensor → valid reading ~0.67m
  # Door CLOSED: panel has dropped away     → NaN (out of range)
  #
  # open_distance_m: reading when door is fully open (panel detected). Measured
  #   ~0.67m; +5cm margin.
  #
  # nan_closed_count: consecutive NaN readings required to declare CLOSED.
  #   At 500ms update interval: 6 = 3s. Garage defaults to CLOSED on boot
  #   (normal physical state — low risk of incorrect assumption).
  open_distance_m: "0.75"    # measured ~0.704m + 5cm margin (2026-05-20, repositioned)
  nan_closed_count: "6"      # 6 × 500ms = 3s sustained NaN → CLOSED

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_ENABLE_WPA3_SAE: "n"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

captive_portal:

bluetooth_proxy:
  active: true

logger:
  level: WARN

api:
  encryption:
    key: !secret esphome_api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── NaN streak tracking ───────────────────────────────────────────────────────
# nan_streak: counts consecutive NaN readings; cover lambda declares CLOSED at threshold.
globals:
  - id: nan_streak
    type: int
    restore_value: false
    initial_value: '0'

# ── I2C bus ──────────────────────────────────────────────────────────────────
i2c:
  sda: GPIO1
  scl: GPIO3
  frequency: 10kHz
  scan: true

# ── VL53L0X distance sensor ───────────────────────────────────────────────────
# Ceiling mount, pointing at door top. Open reads ~0.67m; closed reads NaN.
# EMA filter smooths noisy valid readings; NaN passes through unchanged so the
# nan_streak counter still fires correctly.
sensor:
  - platform: vl53l0x
    name: "Garage Door Distance"
    id: door_distance
    address: 0x29
    update_interval: 500ms
    long_range: true
    filters:
      - lambda: |-
          static float avg = NAN;
          static float last_pub = NAN;
          static int nan_count = 0;
          if (isnan(x)) {
            nan_count++;
            id(nan_streak)++;
            if (nan_count < 2) return {};
            avg = NAN; last_pub = NAN;
            return x;
          }
          nan_count = 0;
          id(nan_streak) = 0;
          avg = isnan(avg) ? x : avg * 0.5f + x * 0.5f;
          if (!isnan(last_pub) && fabsf(avg - last_pub) < 0.02f) return {};
          last_pub = avg;
          return avg;

# ── SSR trigger ──────────────────────────────────────────────────────────────
# GPIO7 → 220Ω → G3VM-61A1 SSR → Marantec XB03 terminals 1+2 (GND+Pulse)
switch:
  - platform: gpio
    pin: GPIO7
    id: garage_trigger
    restore_mode: ALWAYS_OFF
    internal: true

# ── Pulse script ─────────────────────────────────────────────────────────────
script:
  - id: trigger_pulse
    then:
      - switch.turn_on: garage_trigger
      - delay: 300ms
      - switch.turn_off: garage_trigger

# ── Garage door cover ────────────────────────────────────────────────────────
# State logic:
#   distance <= open_distance_m             → OPEN  (panel detected near sensor)
#   NaN sustained >= nan_closed_count × 500ms → CLOSED (panel out of range)
#   anything else                           → indeterminate
#
# STOP BUTTON — confirmed 2026-05-20:
# Marantec Comfort 280 cycle: Open → Stop → Close → Stop → Open.
# After stop mid-travel, next impulse REVERSES — do not rely on stop + resume from HA.
cover:
  - platform: template
    name: "Garage Door"
    device_class: garage
    lambda: |-
      if (!id(door_distance).has_state()) {
        return {};
      }
      float d = id(door_distance).state;
      if (!isnan(d) && d > 0) {
        if (d <= ${open_distance_m}) {
          return COVER_OPEN;
        }
        return {};
      }
      if (id(nan_streak) >= ${nan_closed_count}) {
        return COVER_CLOSED;
      }
      return {};
    open_action:
      - script.execute: trigger_pulse
    close_action:
      - script.execute: trigger_pulse
    stop_action:
      - script.execute: trigger_pulse
